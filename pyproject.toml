[project]
name = "grocery-deals-mcp"
version = "0.1.0"
description = "MCP server exposing weekly grocery-store circulars for any US ZIP code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27",
]

[project.scripts]
grocery-deals-mcp = "grocery_deals_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grocery_deals_mcp"]
